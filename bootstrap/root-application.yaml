apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/leandrocarpenter/platform-gitops-engine.git
    targetRevision: main
    path: environments/local/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true